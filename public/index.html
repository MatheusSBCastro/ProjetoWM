<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Projeto WM</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workout.css"><link rel="stylesheet" href="sprite.css"><link rel="stylesheet" href="portals.css"><link rel="stylesheet" href="profiles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="fixes.css"></head>
<body>
  <main id="login" class="login-shell"><section id="portalPicker" class="portal-card"><div class="brand">WM</div><p class="eyebrow">PROJETO WM</p><h1>Escolha seu acesso.</h1><p class="muted">Cada área foi criada para uma experiência diferente.</p><div class="portal-grid"><button onclick="selectPortal('aluno')"><b>Aluno</b><span>Check-in, treino e evolução</span></button><button onclick="selectPortal('professor')"><b>Professor</b><span>Alunos, aulas e avaliações</span></button><button onclick="selectPortal('admin')"><b>ADM</b><span>Gestão completa da equipe</span></button><button class="consulting-entry" onclick="selectPortal('consulting')"><small>PREMIUM</small><b>Consulting WM</b><span>Treino e plano alimentar</span></button></div></section><section id="loginCard" class="login-card" hidden><button class="back-link" onclick="backToPortals()">← Voltar</button><div class="brand">WM</div><p id="portalEyebrow" class="eyebrow">ACESSO</p><h1 id="portalTitle">Entrar.</h1><p id="portalDescription" class="muted"></p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="email" required></label><label>Senha<input id="password" type="password" value="123456" autocomplete="current-password" required></label><button>Entrar</button><p id="loginError" class="error"></p></form><div id="demoCredentials" class="demo"></div></section></main>
  <div id="app" hidden><header><div class="brand small">WM</div><div><strong>Projeto WM</strong><small id="userLabel"></small></div><button class="ghost" onclick="logout()">Sair</button></header><nav id="nav"></nav><main id="content" class="content"></main></div>
  <script src="app.js"></script>
</body></html>
